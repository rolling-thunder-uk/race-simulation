# config/track_environments.toml

[meta]
# Active location used by the simulator at launch. Add your own sections below
# and point this token at the section key.
active_location = "DEVELOPMENT_EXAMPLE"

# DEVELOPMENT EXAMPLE DATA - replace with real track measurements.
[DEVELOPMENT_EXAMPLE]
location_name = "Development Example Track"
track_length_m = 20.0
ambient_temperature_c = 22.0
ambient_pressure_kpa = 101.30
relative_humidity_percent = 55.0
guide_wire_tension_newtons = 12.0
orifice_throat_diameter_mm = 3.20

[uncertainties]
# DEVELOPMENT EXAMPLE SPREAD - set to 0.0 for a perfectly clean static run.
ambient_temp_std_dev_c = 0.5
ambient_pressure_std_dev_kpa = 0.20
orifice_diameter_std_dev_mm = 0.02
