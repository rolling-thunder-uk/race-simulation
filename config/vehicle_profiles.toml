# config/vehicle_profiles.toml

[meta]
# Active profile used by the simulator at launch. Add your own sections below
# and point this token at the section key.
active_profile = "DEVELOPMENT_EXAMPLE"

# DEVELOPMENT EXAMPLE DATA - replace with real competition measurements.
[DEVELOPMENT_EXAMPLE]
name = "Dev Example"
empty_mass_grams = 55.0
frontal_area_m2 = 0.001800
drag_coefficient_cd = 0.150
lift_coefficient_cl = -0.050
wheelbase_mm = 150.0
nozzle_center_offset_y_mm = 8.0
bearing_base_friction_mu = 0.002

[uncertainties]
# DEVELOPMENT EXAMPLE SPREAD - set to 0.0 for a perfectly clean static run.
mass_std_dev_grams = 0.5
cd_std_dev = 0.005
cl_std_dev = 0.005
bearing_mu_std_dev = 0.0002
